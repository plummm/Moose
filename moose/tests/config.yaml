# LiteLLM Proxy Configuration Template
# Copy this file to config.yaml and customize for your needs

model_list:
  # OpenAI Models
  - model_name: gpt-4
    litellm_params:
      model: openai/gpt-4
    model_info:
      input_cost_per_token: 0.00003
      output_cost_per_token: 0.00006
  
  - model_name: gpt-4-turbo
    litellm_params:
      model: openai/gpt-4-turbo-preview
    model_info:
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00003

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_base: os.environ/AZURE_API_BASE
    model_info:
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00003
  
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openai/gpt-3.5-turbo
    model_info:
      input_cost_per_token: 0.0000015
      output_cost_per_token: 0.000002
  
  # Anthropic Models
  - model_name: claude-3-opus
    litellm_params:
      model: anthropic/claude-3-opus-20240229
    model_info:
      input_cost_per_token: 0.000015
      output_cost_per_token: 0.000075
  
  - model_name: claude-3-sonnet
    litellm_params:
      model: anthropic/claude-3-sonnet-20240229
    model_info:
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
  
  - model_name: claude-3-haiku
    litellm_params:
      model: anthropic/claude-3-haiku-20240307
    model_info:
      input_cost_per_token: 0.00000025
      output_cost_per_token: 0.00000125
  
  # Google Models
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-pro
    model_info:
      input_cost_per_token: 0.0000005
      output_cost_per_token: 0.0000015
  
  - model_name: gemini-ultra
    litellm_params:
      model: gemini/gemini-ultra
    model_info:
      input_cost_per_token: 0.00000125
      output_cost_per_token: 0.000005

# General Settings
general_settings:
  # Master key for proxy authentication (change this!)
  # master_key: "sk-1234_for_testing_kk"
  
  # Optional: Database URL for storing logs and costs
  # database_url: "postgresql://user:password@localhost/litellm"
  
  # Optional: Enable/disable features
  # enable_pre_call_checks: true
  # enable_post_call_metrics: true

# LiteLLM Settings
litellm_settings:
  # Callbacks for logging (optional)
  # success_callback: ["postgres", "s3"]
  # failure_callback: ["postgres"]
  
  # Set to true for verbose logging
  # set_verbose: false

# Optional: Load Balancing
# router_settings:
