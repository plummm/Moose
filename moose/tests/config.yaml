# LLM Model Cost Configuration
# This config file defines cost rates per token for different models
# Used for cost calculation when token usage is available

models:
  # OpenAI Models
  - model_name: gpt-5
    input_cost_per_million_token: 1.25
    output_cost_per_million_token: 10.0
  
  - model_name: gpt-4-turbo
    input_cost_per_million_token: 10.0
    output_cost_per_million_token: 30.0

  - model_name: gpt-4o
    input_cost_per_million_token: 5.0
    output_cost_per_million_token: 15.0
  
  - model_name: gpt-3.5-turbo
    input_cost_per_million_token: 1.5
    output_cost_per_million_token: 2.0
  
  # Anthropic Models
  - model_name: claude-sonnet-4-5-20250929
    input_cost_per_million_token: 3.0
    output_cost_per_million_token: 15.0
  
  - model_name: claude-sonnet-4-20250514
    input_cost_per_million_token: 3.0
    output_cost_per_million_token: 15.0
  
  - model_name: claude-3-sonnet
    input_cost_per_million_token: 3.0
    output_cost_per_million_token: 15.0
  
  - model_name: claude-3-haiku
    input_cost_per_million_token: 0.25
    output_cost_per_million_token: 1.25
  
  # Google Models
  - model_name: gemini-2.5-flash
    input_cost_per_million_token: 0.125
    output_cost_per_million_token: 0.5
  
  - model_name: gemini-ultra
    input_cost_per_million_token: 1.25
    output_cost_per_million_token: 5.0
